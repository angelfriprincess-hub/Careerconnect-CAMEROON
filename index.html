<section id="cv-request" style="margin-top:55px;"> <h2 class="section-title">Request CV Assistance</h2> <p class="section-intro">Complete this form to request help with your CV or cover letter.</p>

<form class="form-box" action="https://formsubmit.co/careerconnectcameroon@gmail.com" method="POST"> <input type="hidden" name="_subject" value="New CV Assistance Request - CareerConnect Cameroon">

<label for="cv-name">Full Name</label>
<input id="cv-name" type="text" name="Full Name" required>

<label for="cv-email">Email Address</label>
<input id="cv-email" type="email" name="Email Address" required>

<label for="cv-service">Service Needed</label>
<select id="cv-service" name="Service Needed" required>
  <option value="">Choose a service</option>
  <option>CV Writing or Improvement</option>
  <option>Cover Letter Writing</option>
  <option>Both CV and Cover Letter</option>
</select>

<label for="cv-message">Tell us what assistance you need</label>
<textarea id="cv-message" name="Request Details" required></textarea>

<button class="button" type="submit">Send CV Request</button>

</form> </section>
